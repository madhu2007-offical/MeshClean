name: CI/CD - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
    
    - name: Test imports
      run: |
        python -c "from pipeline_debug_env import PipelineDebugEnv; print('✓ Core OK')"
        python -c "from inference import DebugAgent; print('✓ Agent OK')"
        python -c "from ui_minimal import app; print('✓ UI OK')"
    
    - name: Test all tasks
      run: |
        python << 'EOF'
        from inference import DebugAgent
        for task in ['task_1', 'task_2', 'task_3']:
            agent = DebugAgent(task)
            result = agent.run()
            grade = result.get('grade', 0.0)
            print(f"✓ {task}: {grade:.0%}")
        EOF

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: meshclean-debugger:latest
        cache-from: type=registry,ref=meshclean-debugger:buildcache
        cache-to: type=registry,ref=meshclean-debugger:buildcache,mode=max
    
    - name: Test Docker image
      run: |
        docker build -t meshclean-debugger:test .
        docker run --rm meshclean-debugger:test python -c "from pipeline_debug_env import PipelineDebugEnv; print('✓ Docker OK')"

  notify:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: always()
    
    steps:
    - name: Check job status
      run: |
        if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.docker.result }}" = "success" ]; then
          echo "✅ All checks passed!"
          exit 0
        else
          echo "❌ Some checks failed"
          exit 1
        fi
